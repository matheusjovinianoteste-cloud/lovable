<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site de Teste</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #2563eb);
      color: white;
    }
    .card {
      width: min(90%, 520px);
      padding: 48px 32px;
      text-align: center;
      background: rgba(255,255,255,.1);
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 50px rgba(0,0,0,.25);
    }
    h1 { margin: 0 0 12px; font-size: 42px; }
    p { margin: 0 0 28px; color: #dbeafe; font-size: 18px; }
    button {
      border: 0;
      padding: 13px 24px;
      border-radius: 10px;
      background: white;
      color: #1d4ed8;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { transform: translateY(-1px); }
    #status { margin-top: 18px; font-size: 14px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Olá! 👋</h1>
    <p>Este é um site simples de teste criado diretamente no GitHub.</p>
    <button onclick="document.getElementById('status').textContent='Funcionando perfeitamente! 🚀'">
      Testar botão
    </button>
    <div id="status"></div>
  </main>
</body>
</html>
